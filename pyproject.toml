[project]
name = "layermed-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "bcrypt==4.0.1",
    "fakeredis>=2.37.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jwt>=1.4.0",
    "loguru>=0.7.3",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "pip>=26.2.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pydantic[all,email]>=2.13.4",
    "pyjwt>=2.13.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "ruff>=0.16.1",
    "setuptools>=83.0.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.51",
    "types-aiobotocore-s3>=3.9.0",
    "uvicorn>=0.52.3",
    "zxcvbn>=4.5.0",
]


[tool.pyright]
typeCheckingMode='standard'

[tool.ruff]
extend-exclude = [
    "migrations"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
